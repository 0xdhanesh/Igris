name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "31 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v3
        with:
          category: /language:${{ matrix.language }}

  required:
    name: CodeQL required
    if: always()
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CODEQL_RESULT: ${{ needs.analyze.result }}
    steps:
      - name: Enforce CodeQL analysis
        run: test "$CODEQL_RESULT" = success
